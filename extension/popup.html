<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 12px; }
    textarea { width: 100%; height: 60px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 10px; display: none; }
    .score { font-weight: bold; text-align: center; font-size: 18px; margin-bottom: 8px; }
    .high { color: red; }
    .safe { color: green; }
  </style>
</head>
<body>
  <h3>🛡️ ScamShield</h3>
  <textarea id="inputText" placeholder="Paste message here..."></textarea>
  <button id="analyzeBtn">Analyze</button>
  <div id="result">
    <div id="scoreDisplay" class="score"></div>
    <strong>Why suspicious:</strong>
    <ul id="reasonsList"></ul>
    <strong>What to do:</strong>
    <ul id="actionList"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
